name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag
        type: choice
        options: [experimental, latest]
        default: experimental
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Check prerelease distribution tag
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(p.version.includes('-') && process.env.DIST_TAG==='latest') throw new Error('Use experimental for a prerelease');"
      - name: Publish using npm trusted publishing
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG"
