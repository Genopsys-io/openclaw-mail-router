name: Validate plugin
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm pack --json > package-artifact.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-node-${{ matrix.node }}
          path: |
            *.tgz
            package-artifact.json

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r analyzer/requirements.txt
      - run: python -m unittest discover -s analyzer -p 'test_*.py' -v
      - run: docker build --pull --tag mail-analyzer-test analyzer
      - run: >-
          docker run --rm mail-analyzer-test python -c
          "import os, pypdf, server; assert os.geteuid() == 10001"
